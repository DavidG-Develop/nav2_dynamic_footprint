dynamic_footprint:
  ros__parameters:
    # Leave empty to subscribe; explicit URDF XML takes precedence over the topic.
    robot_description: ""
    robot_description_topic: robot_description
    base_frame: base_link
    footprint_topic: dynamic_footprint
    # Runtime tuning; other package parameters above are read-only.
    publish_rate: 10.0
    max_transform_age: 0.5
    use_sim_time: false
