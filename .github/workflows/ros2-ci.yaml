name: ROS 2 CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.ros_distro }}
    runs-on: ubuntu-latest
    container:
      image: ros:${{ matrix.ros_distro }}-ros-base-${{ matrix.ubuntu }}
    continue-on-error: ${{ matrix.ros_distro == 'rolling' }}
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [jazzy, lyrical, rolling]
        include:
          - ros_distro: jazzy
            ubuntu: noble
          - ros_distro: lyrical
            ubuntu: resolute
          - ros_distro: rolling
            ubuntu: resolute
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/nav2_dynamic_footprint
      - name: Install dependencies
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-rosdep
          if [ ! -e /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            rosdep init
          fi
          rosdep update --rosdistro ${{ matrix.ros_distro }}
          rosdep install --from-paths src --ignore-src -r -y --rosdistro ${{ matrix.ros_distro }}
      - name: Build
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon build --symlink-install --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Test geometry, linters, components, standalone and Nav2 integration
        run: |
          source install/setup.bash
          colcon test --event-handlers console_direct+ --return-code-on-test-failure
      - name: Report results
        if: always()
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon test-result --verbose
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.ros_distro }}
          path: |
            log/
            build/*/test_results/
