name: ROS 2 CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.ros_distro }}
    runs-on: ubuntu-latest
    container:
      image: ros:${{ matrix.ros_distro }}-ros-base-${{ matrix.ubuntu }}
    continue-on-error: ${{ matrix.ros_distro == 'rolling' }}
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [jazzy, lyrical, rolling]
        include:
          - ros_distro: jazzy
            ubuntu: noble
          - ros_distro: lyrical
            ubuntu: resolute
          - ros_distro: rolling
            ubuntu: resolute
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/nav2_dynamic_footprint
      - name: Fetch unreleased Rolling Nav2 dependencies
        if: matrix.ros_distro == 'rolling'
        uses: actions/checkout@v4
        with:
          repository: ros-navigation/navigation2
          ref: main
          path: src/navigation2
          sparse-checkout: |
            nav2_common
            nav2_msgs
            nav2_ros_common
            nav2_util
            nav2_voxel_grid
            nav2_costmap_2d
            nav2_lifecycle_manager
      - name: Set up dependency tooling
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-rosdep
          if [ ! -e /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            rosdep init
          fi
          rosdep update --rosdistro ${{ matrix.ros_distro }}
      - name: Build Rolling Nav2 dependencies
        if: matrix.ros_distro == 'rolling'
        run: |
          source /opt/ros/rolling/setup.bash
          rosdep install --from-paths src/navigation2 --ignore-src -y --rosdistro rolling \
            -t build -t buildtool -t build_export -t buildtool_export -t exec
          colcon build --base-paths src/navigation2 --symlink-install \
            --cmake-args -DBUILD_TESTING=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Install and verify package dependencies
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          if [ -f install/setup.bash ]; then source install/setup.bash; fi
          rosdep install --from-paths src/nav2_dynamic_footprint --ignore-src -y \
            --rosdistro ${{ matrix.ros_distro }}
          rosdep check --from-paths src/nav2_dynamic_footprint --ignore-src \
            --rosdistro ${{ matrix.ros_distro }}
          ros2 pkg prefix nav2_costmap_2d
          ros2 pkg prefix nav2_lifecycle_manager
      - name: Build
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          if [ -f install/setup.bash ]; then source install/setup.bash; fi
          colcon build --packages-select nav2_dynamic_footprint --symlink-install \
            --cmake-args -DBUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Test geometry, linters, components, standalone and Nav2 integration
        run: |
          source install/setup.bash
          colcon test --packages-select nav2_dynamic_footprint \
            --event-handlers console_direct+ --return-code-on-test-failure
      - name: Report results
        if: always()
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          if [ -d build ]; then
            colcon test-result --test-result-base build --verbose
          else
            echo "::notice::No build directory: an earlier checkout or dependency step failed. See the first failed step."
            echo "No test results: the job failed before creating a build directory. See the first failed step." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.ros_distro }}
          path: |
            log/
            build/*/test_results/
